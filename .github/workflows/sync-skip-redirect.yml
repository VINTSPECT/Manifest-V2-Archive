name: Sync Skip Redirect Extension

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          UPSTREAM_REPO="sblask-webextensions/webextension-skip-redirect"
          MY_REPO="${{ github.repository }}"
          
          # Get the latest tag
          UPSTREAM_TAG=$(gh api repos/$UPSTREAM_REPO/releases/latest --jq .tag_name)
          
          # Create a custom tag name
          MY_TAG="skip-redirect-${UPSTREAM_TAG}"
          
          echo "Checking release: $MY_TAG"
          
          # Check if the release already exists
          if gh release view "$MY_TAG" --repo "$MY_REPO" >/dev/null 2>&1; then
            echo "Release $MY_TAG already exists. No action needed."
          else
            echo "Creating new release: $MY_TAG"
            
            mkdir -p assets
            cd assets
            gh release download "$UPSTREAM_TAG" --repo "$UPSTREAM_REPO"
            
            RELEASE_NOTES=$(gh api repos/$UPSTREAM_REPO/releases/latest --jq .body)
            echo "$RELEASE_NOTES" > notes.txt
            
            gh release create "$MY_TAG" * \
              --repo "$MY_REPO" \
              --title "Skip Redirect $UPSTREAM_TAG" \
              --notes-file notes.txt
              
            echo "Successfully created release!"
          fi
