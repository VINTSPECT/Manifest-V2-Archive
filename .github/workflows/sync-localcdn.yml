name: Sync LocalCDN (Codeberg)

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync Release from Codeberg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          UPSTREAM_OWNER="nobody"
          UPSTREAM_REPO="LocalCDN"
          MY_REPO="${{ github.repository }}"
          
          # Fetch latest release data from Codeberg API using curl
          API_URL="https://codeberg.org/api/v1/repos/$UPSTREAM_OWNER/$UPSTREAM_REPO/releases/latest"
          RELEASE_DATA=$(curl -s "$API_URL")
          
          # Extract the tag name using jq
          UPSTREAM_TAG=$(echo "$RELEASE_DATA" | jq -r '.tag_name // empty')
          
          if [ -z "$UPSTREAM_TAG" ]; then
            echo "No release found on Codeberg for $UPSTREAM_OWNER/$UPSTREAM_REPO. Exiting."
            exit 0
          fi
          
          # Create a custom tag name to prevent conflicts
          MY_TAG="localcdn-${UPSTREAM_TAG}"
          
          echo "Checking release: $MY_TAG"
          
          # Check if the release already exists on your GitHub repo
          if gh release view "$MY_TAG" --repo "$MY_REPO" >/dev/null 2>&1; then
            echo "Release $MY_TAG already exists. No action needed."
          else
            echo "Creating new release: $MY_TAG"
            
            mkdir -p assets
            cd assets
            
            # Extract download URLs from Codeberg and download them using curl
            echo "$RELEASE_DATA" | jq -r '.assets[].browser_download_url' | while read -r url; do
              if [ -n "$url" ] && [ "$url" != "null" ]; then
                echo "Downloading $url..."
                curl -sLO "$url"
              fi
            done
            
            # Verify if any asset files were successfully downloaded
            if [ -n "$(ls -A .)" ]; then
              # Extract release notes
              echo "$RELEASE_DATA" | jq -r '.body // "No release notes."' > notes.txt
              echo -e "\n\n---\n*Auto-synced from Codeberg: https://codeberg.org/$UPSTREAM_OWNER/$UPSTREAM_REPO*" >> notes.txt
              
              # Upload the assets to your GitHub repository
              gh release create "$MY_TAG" * \
                --repo "$MY_REPO" \
                --title "LocalCDN $UPSTREAM_TAG" \
                --notes-file notes.txt
                
              echo "Successfully created release for LocalCDN!"
            else
              echo "Failed to download assets. Skipping release creation."
            fi
          fi
